          center;
      }
    </style>

    <script>
      function extractUserIdFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return params.get("templateId") || null;
        // return "68f764ba86a7b0500345d4b3";
      }
      (async function () {
        try {
          // 1. Get the user ID from URL
          //const userId = "68a2c2824795a3d2a447e50f";
          const userId = extractUserIdFromUrl();
          // const pathParts = window.location.pathname.split('/');
          // const userId = pathParts[pathParts.length - 1];
          console.log("User ID:", userId);
          // 2. Fetch AR data from API
          //const apiUrl = `https://greetings-card-apis.tecshield.net/api/user/ar-experience/get/${userId}`;
          const apiUrl = `https://api.incardible.com.au/api/user/ar-experience/get/${userId}`;
          const res = await fetch(apiUrl, { cache: "no-cache" });
          if (!res.ok) throw new Error("Failed to fetch AR experience data");
          const json = await res.json();
          console.log("Fetched AR data:", json);
          // 3. Validate required data
          const cardFront = json.data?.cardId?.frontDesign;
          const rightImage = json.data?.arTemplateData?.rightImageUrl;
          if (!cardFront) throw new Error("frontDesign missing from cardId");
          if (!rightImage)
            throw new Error("rightImageUrl missing from arTemplateData");
          // 4. Update AR image target sources
          document.getElementById("frontCard").setAttribute("src", cardFront);
          document.getElementById("rightCard").setAttribute("src", rightImage);

          // 6. Initialize AR
          await initialize();

          // 7. Auto start AR (simulate button click)
          StartAR();
        } catch (err) {
          console.error("Error initializing AR experience:", err);
          alert("Failed to load AR experience. Please try again.");
        }
        // Helper to load scripts dynamically
        function loadScript(src) {
          return new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.src = src;
            script.onload = resolve;
            script.onerror = reject;
            document.body.appendChild(script);
          });
        }
      })();
    </script>

    <script>
      // Disable double-tap to zoom

      document.addEventListener(
        "touchstart",
        function (event) {
          if (event.touches.length > 1) {
            event.preventDefault();
          }
        },
        { passive: false }
      );
      // Disable pinch to zoom
      document.addEventListener("gesturestart", function (event) {
        event.preventDefault();
      });
      async function initialize() {
        var unityCanvas = document.querySelector("#unity-canvas");
        var videoCanvas = document.querySelector("#video-canvas");
        window.arCamera = new ARCamera(unityCanvas, videoCanvas);
        window.iTracker = new ImageTracker(arCamera);
        try {
          await window.iTracker.initialize("./opencv.js");
          console.log("ImageTracker initialized!");
        } catch (error) {
          console.error(
            "Failed to initialize ImageTracker. Are you missing opencv.js? ",
            error
          );
          ShowError("Failed to initialize the experience.");
          return;
        }
        await LoadWebcams();
        window.permissionsGranted = await IsCameraPermissionGranted();
      }

      // initialize();
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });
      var instanceObj;
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");
      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length
            ? "block"
            : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == "error") div.style = "background: red; padding: 10px;";
        else {
          if (type == "warning")
            div.style = "background: yellow; padding: 10px;";
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }
      // function extractUserIdFromUrl() {
      //     const pathParts = window.location.pathname.split("/").filter(Boolean);
      //     // Get the last segment (assumed to be the ID)
      //     const idFromPath = pathParts[pathParts.length - 1];
      //     return idFromPath || null;
      // }

      function StartAR() {
        var startARDiv = document.querySelector("#startARDiv");
        startARDiv.style.opacity = 0;
        setTimeout(() => {
          startARDiv.style.visibility = "hidden";
        }, 500);
        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/Ar Build.loader.js";
        var config = {
          dataUrl: buildUrl + "/Ar Build.data",
          frameworkUrl: buildUrl + "/Ar Build.framework.js",
          codeUrl: buildUrl + "/Ar Build.wasm",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "DefaultCompany",
          productName: "My project",
          productVersion: "1.0.0",
          showBanner: unityShowBanner,
        };
        // By default Unity keeps WebGL canvas render target size matched with
        // the DOM size of the canvas element (scaled by window.devicePixelRatio)
        // Set this to false if you want to decouple this synchronization from
        // happening inside the engine, and you would instead like to size up
        // the canvas DOM size and WebGL render target sizes yourself.
        // config.matchWebGLToCanvasSize = false;
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          // Mobile device style: fill the whole browser client area with the game canvas:
          var meta = document.createElement("meta");
          meta.name = "viewport";
          meta.content =
            "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
          document.getElementsByTagName("head")[0].appendChild(meta);
        }
        loadingBar.style.display = "block";
        const userArExperienceId = extractUserIdFromUrl();
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = 100 * progress + "%";
          })
            .then((unityInstance) => {
              loadingBar.style.display = "none";
              instanceObj = unityInstance;
              window.unityInstance = unityInstance;

              // 🖱️ Auto "tap" simulation after Unity loads
              setTimeout(() => {
                const c = document.querySelector("#unity-canvas");
                if (c) {
                  console.log("👆 Simulating user tap on Unity canvas");
                  c.focus();
                  ["mousedown", "mouseup", "click"].forEach((type) => {
                    const evt = new Event(type, {
                      bubbles: true,
                      cancelable: true,
                    });
                    c.dispatchEvent(evt);
                  });
                }
              }, 150); // short delay to ensure canvas is ready

              console.log(
                "userArExperienceId------------------------",
                userArExperienceId
              );
              if (userArExperienceId) {
                console.log(
                  "userArExperienceId-----------------------after-",
                  userArExperienceId
                );
                const apiUrl = `https://api.incardible.com.au/api/user/ar-experience/get/${userArExperienceId}`;
                console.log("apiUrl", apiUrl);
                fetch(apiUrl, {
                  method: "GET",
                  headers: {
                    "Content-Type": "application/json",
                  },
                })
                  .then((response) => response.json())
                  .then((data) => {
                    console.log("data in ar experience-------", data);
                    unityInstance.SendMessage(
                      "ArJsonData",
                      "userArExperience",
                      JSON.stringify(data)
                    );
                  })
                  .catch((error) => {
                    console.error("Error:", error);
                    unityInstance.SendMessage(
                      "ArJsonData",
                      "userArExperience",
                      JSON.stringify({})
                    );
                  });
              } else {
                unityInstance.SendMessage(
                  "ArJsonData",
                  "userArExperience",
                  JSON.stringify({})
                );
              }
              if (window.permissionsGranted) {
                console.log(
                  "Camera permission already granted — starting webcam directly."
                );
                StartWebcam();
              } else {
                console.log("Requesting camera permission first...");
                RequestCameraAndRefocus();
              }
            })
            .catch((message) => {
              alert(message);
            });
        };
        document.body.appendChild(script);
      }
      //Set Facing Mode here ('environment', 'user', '')
      window.unityFacingMode = "environment";
      window.WEBCAM_SETTINGS = {
        video: {
          facingMode: unityFacingMode,
        },
        audio: false,
      };

      /* -------------------------------------------------------------------------- */
      /*                           📸 CAMERA REQUEST (Priming)                      */
      /* -------------------------------------------------------------------------- */

      async function RequestWebcam() {
        logStep("📸 RequestWebcam: start");
        window.requestingForPermissions = true;

        try {
          logStep(
            "Requesting permissions with settings:",
            window.WEBCAM_SETTINGS
          );

          if (window.webcamStream) {
            window.webcamStream.getTracks().forEach((t) => t.stop());
            window.webcamStream = null;
          }

          window.webcamStream = await navigator.mediaDevices.getUserMedia(
            window.WEBCAM_SETTINGS
          );
          logStep("✅ Webcam access granted (priming stream created).");

          // mark done
          window.requestingForPermissions = false;

          // If we were ONLY priming (permission wasn’t granted before), stop immediately
          if (!window.permissionsGranted && window.webcamStream) {
            logStep("Stopping priming stream (was just to trigger permission)");
            window.webcamStream.getTracks().forEach((t) => t.stop());
          }
        } catch (err) {
          console.error("❌ getUserMedia error - ", err);
          ShowError(
            "Failed to start the experience. Camera permission was denied"
          );
          window.requestingForPermissions = false;
        }

        logStep("RequestWebcam: calling forceRedraw()");
        // Ensure focus returns to page (sometimes Chrome loses it)
      }

      async function RequestCameraAndRefocus() {
        logStep("📸 RequestWebcam: start");
        window.requestingForPermissions = true;

        try {
          logStep(
            "Requesting permissions with settings:",
            window.WEBCAM_SETTINGS
          );
          window.webcamStream = await navigator.mediaDevices.getUserMedia(
            window.WEBCAM_SETTINGS
          );
          logStep("✅ Webcam access granted (priming stream created).");

          // mark done
          window.requestingForPermissions = false;

          // Stop priming stream if it was just for permission
          if (!window.permissionsGranted && window.webcamStream) {
            logStep("Stopping priming stream (was just to trigger permission)");
            window.webcamStream.getTracks().forEach((t) => t.stop());
          }

          // ✅ Show black overlay now that permission prompt closed
          showCameraOverlay();
        } catch (err) {
          console.error("❌ getUserMedia error - ", err);
          ShowError(
            "Failed to start the experience. Camera permission was denied"
          );
          window.requestingForPermissions = false;
        }
      }

      function showCameraOverlay() {
        const overlay = document.getElementById("cameraOverlay");
        if (!overlay) return;
        overlay.style.display = "flex";

        // Wait for a user tap to continue
        const handleTap = () => {
          overlay.style.display = "none";
          //restoreUnityFocus();
          window.removeEventListener("pointerdown", handleTap);
        };

        window.addEventListener("pointerdown", handleTap, { once: true });
      }

      function restoreUnityFocus() {
        const canvas = document.querySelector("#unity-canvas");
        if (canvas) {
          canvas.focus({ preventScroll: true });
          ["mousedown", "mouseup", "click"].forEach((type) => {
            const evt = new Event(type, { bubbles: true, cancelable: true });
            canvas.dispatchEvent(evt);
          });
          // window.dispatchEvent(new Event("resize"));
          console.log("✅ Unity focus restored after tap");
        }
      }

      function logStep(...args) {
        console.log(`[${new Date().toISOString()}]`, ...args);
      }
      /* -------------------------------------------------------------------------- */
      /*                            🔁 FORCE REDRAW HELPERS                         */
      /* -------------------------------------------------------------------------- */

      function forceRedraw() {
        const c = document.querySelector("#unity-canvas");
        const blackOverlay = document.getElementById("blackOverlay");
        if (!c) return console.log("⚠️ forceRedraw: Unity canvas not found");

        console.log("🎨 forceRedraw triggered — showing black overlay");

        // SHOW BLACK OVERLAY IMMEDIATELY - this prevents user from seeing any glitches
        if (blackOverlay) {
          blackOverlay.style.display = "block";
          blackOverlay.style.opacity = "1";
        }

        const prevOpacity = c.style.opacity || "1";
        const prevPointer = c.style.pointerEvents || "";

        // Temporarily disable Unity canvas interactions
        c.style.opacity = "0.999";
        c.style.pointerEvents = "none";
        c.style.transform = "translateZ(0)";
        c.style.willChange = "opacity, transform";

        // Wait for multiple frames to ensure camera resize is complete
        let frames = 0;
        const STABILIZATION_FRAMES = 12; // Increased from 3 to ensure smoother transition

        function stabilize() {
          if (frames++ < STABILIZATION_FRAMES) {
            requestAnimationFrame(stabilize);
            return;
          }

          // Restore Unity canvas
          c.style.opacity = prevOpacity;
          c.style.pointerEvents = prevPointer;
          c.style.willChange = "auto";

          // Dispatch resize to refresh rendering
          window.dispatchEvent(new Event("resize"));

          console.log(
            `✅ forceRedraw stable restore after ${STABILIZATION_FRAMES} frames`
          );

          // KEEP OVERLAY VISIBLE for a bit longer to ensure smooth transition
          setTimeout(() => {
            if (blackOverlay) {
              blackOverlay.style.opacity = "0";
              setTimeout(() => {
                blackOverlay.style.display = "none";
                console.log("✅ Black overlay hidden - transition complete");
              }, 300); // Wait for fade-out animation
            }
          }, 100); // Small delay before starting fade-out
        }

        requestAnimationFrame(stabilize);
      }

      // When returning to the tab, nudge the canvas again if the webcam is live
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && window._webcamStarted) forceRedraw();
      });

      /* -------------------------------------------------------------------------- */
      /*              📸 CAMERA RESIZE DETECTION WITH OVERLAY PROTECTION            */
      /* -------------------------------------------------------------------------- */

      let lastKnownWidth = 0;
      let lastKnownHeight = 0;
      let resizeTimeout = null;

      function monitorCameraResize() {
        const video = document.querySelector("#webcam-video");
        const blackOverlay = document.getElementById("blackOverlay");

        if (!video || !video.videoWidth || !video.videoHeight) {
          // Camera not ready yet, check again soon
          requestAnimationFrame(monitorCameraResize);
          return;
        }

        const currentWidth = video.videoWidth;
        const currentHeight = video.videoHeight;

        // Detect if camera dimensions changed
        if (lastKnownWidth > 0 && lastKnownHeight > 0) {
          if (
            currentWidth !== lastKnownWidth ||
            currentHeight !== lastKnownHeight
          ) {
            console.log(
              `📹 Camera resize detected: ${lastKnownWidth}x${lastKnownHeight} → ${currentWidth}x${currentHeight}`
            );

            // IMMEDIATELY show black overlay
            if (blackOverlay) {
              blackOverlay.style.display = "block";
              blackOverlay.style.opacity = "1";
            }

            // Clear any pending resize handler
            if (resizeTimeout) clearTimeout(resizeTimeout);

            // Wait for resize to stabilize, then redraw
            resizeTimeout = setTimeout(() => {
              console.log(
                "🔄 Camera resize stabilized, triggering forceRedraw"
              );
              forceRedraw();
            }, 300); // Wait for camera to fully adjust
          }
        }

        // Update last known dimensions
        lastKnownWidth = currentWidth;
        lastKnownHeight = currentHeight;

        // Keep monitoring
        requestAnimationFrame(monitorCameraResize);
      }
      /* -------------------------------------------------------------------------- */
      /*                           📸 START WEBCAM (Full Run)                       */
      /* -------------------------------------------------------------------------- */

      window.addEventListener("focus", () => {
        console.log("🟢 Window focused — forcing redraw");
        forceRedraw();
      });

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && window._webcamStarted) {
          console.log("🟢 Tab visible again — forcing redraw");
          forceRedraw();
        }
      });

      // Also handle when device orientation changes
      window.addEventListener("orientationchange", () => {
        console.log("🔄 Orientation changed — forcing redraw");
        const blackOverlay = document.getElementById("blackOverlay");
        if (blackOverlay) {
          blackOverlay.style.display = "block";
          blackOverlay.style.opacity = "1";
        }
        setTimeout(forceRedraw, 100);
      });

      async function StartWebcam() {
        logStep("🚀 StartWebcam called.");

        // start stream
        try {
          logStep(
            "Requesting getUserMedia with settings:",
            window.WEBCAM_SETTINGS
          );
          // added this for testing
          if (window.webcamStream) {
            window.webcamStream.getTracks().forEach((t) => t.stop());
            window.webcamStream = null;
          }

          window.webcamStream = await navigator.mediaDevices.getUserMedia(
            window.WEBCAM_SETTINGS
          );
        } catch (err) {
          logStep("❌ getUserMedia failed immediately:", err);
          return;
        }

        // Wait until any permission-priming call is done
        let safetyCounter = 0;
        while (window.requestingForPermissions) {
          logStep("⏳ Waiting for permission priming to finish...");
          await new Promise((r) => setTimeout(r, 50));
          if (++safetyCounter > 100) {
            logStep("⚠️ Timeout waiting for permissions!");
            break;
          }
        }

        if (!window.webcamStream) {
          console.error(
            "❌ Webcam failed to start - permission not yet granted"
          );
          window.unityInstance?.SendMessage("ARCamera", "OnStartWebcamFail");
          return;
        }

        const video = document.querySelector("#webcam-video");
        logStep("🎥 Assigning webcam stream to video element");
        video.srcObject = window.webcamStream;

        // Ensure the video is actually producing frames
        try {
          await video.play();
          logStep("▶️ video.play() succeeded.");
        } catch (err) {
          logStep("⚠️ video.play() threw error:", err);
        }

        // Wait until metadata/frames are ready
        logStep("⏳ Waiting for video.readyState >= 2 ...");
        const startWait = performance.now();
        await new Promise((resolve) => {
          const check = () => {
            if (video.readyState >= 2) {
              logStep(
                "✅ video.readyState =",
                video.readyState,
                "after",
                (performance.now() - startWait).toFixed(0),
                "ms"
              );
              resolve();
            } else setTimeout(check, 50);
          };
          check();
        });

        try {
          logStep("🎯 Calling arCamera.startWebcam()");
          await arCamera.startWebcam(video);
          logStep("✅ arCamera.startWebcam success!");

          window._webcamStarted = true;
          window.unityInstance?.SendMessage("ARCamera", "OnStartWebcamSuccess");

          // Make Unity background transparent once it has a style
          const c = document.querySelector("#unity-canvas");
          if (c) {
            const bg = window.getComputedStyle(c).backgroundColor;
            logStep("🎨 Unity canvas background before:", bg);
            c.style.background = bg.replace("rgb", "rgba").replace(")", ", 0)");
            logStep("✅ Unity canvas background made transparent");
          } else {
            logStep(
              "⚠️ Unity canvas not found when making background transparent"
            );
          }

          // Nudge focus/click (helps certain Android builds)
          const c2 = document.querySelector("#unity-canvas");
          if (c2) {
            logStep("🖱️ Dispatching fake mouse events to canvas");
            c2.focus();
            ["mousedown", "mouseup", "click"].forEach((t) =>
              c2.dispatchEvent(
                new MouseEvent(t, { bubbles: true, cancelable: true })
              )
            );
          }

          // Extra repaint nudge
          logStep("🔁 Calling forceRedraw()");
          forceRedraw();
          // START MONITORING CAMERA RESIZE
          console.log("👀 Starting camera resize monitor");
          monitorCameraResize();
          logStep("✅ StartWebcam finished successfully");
        } catch (err) {
          console.error("❌ Webcam failed to start - ", err);
          window.unityInstance?.SendMessage("ARCamera", "OnStartWebcamFail");
        }
      }

      /* -------------------------------------------------------------------------- */
      /*                           🎥 LOAD AVAILABLE CAMERAS                        */
      /* -------------------------------------------------------------------------- */

      async function LoadWebcams() {
        logStep("📋 LoadWebcams called — enumerating devices...");
        let camDevices = [];
        let devices = [];

        try {
          devices = await navigator.mediaDevices.enumerateDevices();
        } catch (err) {
          logStep("❌ enumerateDevices failed:", err);
          return;
        }

        logStep("📷 Found", devices.length, "media devices");

        devices.forEach((mediaDevice) => {
          if (mediaDevice.kind === "videoinput") {
            const label = mediaDevice.label || "(no label)";
            if (
              window.unityFacingMode == "environment" &&
              !label.includes("facing front")
            ) {
              camDevices.push(mediaDevice);
            } else if (
              window.unityFacingMode == "user" &&
              label.includes("facing front")
            ) {
              camDevices.push(mediaDevice);
            } else {
              camDevices.push(mediaDevice);
            }
          }
        });

        logStep(
          "✅ Video input devices after filtering:",
          camDevices.map((c) => c.label)
        );

        const select = document.getElementById("chooseCamSel");
        if (select) {
          logStep("🎛️ Populating camera <select> element");
          select.style.visibility = "visible";

          camDevices = camDevices.reverse();
          select.innerHTML = ""; // reset
          camDevices.forEach((mediaDevice, count) => {
            const option = document.createElement("option");
            option.value = mediaDevice.deviceId;
            option.textContent = mediaDevice.label || `Camera ${count}`;
            select.appendChild(option);
          });

          if (select.options.length > 0) {
            iTracker.WEBCAM_NAME =
              select.options[select.selectedIndex].innerHTML;
            logStep("📸 Selected default webcam:", iTracker.WEBCAM_NAME);
          }
        } else {
          logStep("⚠️ #chooseCamSel not found in DOM");
        }
      }

      function SelectCam() {
        var select = document.getElementById("chooseCamSel");
        window.deviceId = select.value;
        window.WEBCAM_SETTINGS.video["deviceId"] = deviceId;
        //console.log(window.WEBCAM_SETTINGS);
        iTracker.WEBCAM_NAME = select.options[select.selectedIndex].innerHTML;
      }
      async function FlipCam() {
        arCamera.stopWebcam();
        window.WEBCAM_SETTINGS.video.deviceId = "";
        if (window.WEBCAM_SETTINGS.video.facingMode == "user") {
          window.WEBCAM_SETTINGS.video.facingMode = "environment";
          arCamera.setFlipped(false);
        } else {
          window.WEBCAM_SETTINGS.video.facingMode = "user";
          arCamera.setFlipped(true);
        }
        window.webcamStream = await navigator.mediaDevices.getUserMedia(
          window.WEBCAM_SETTINGS
        );
        const video = document.querySelector("#webcam-video");
        video.srcObject = webcamStream;
        await arCamera.startWebcam(video);
      }
      async function IsCameraPermissionGranted() {
        if (!navigator.permissions || !navigator.mediaDevices) {
          console.log("Permissions API or mediaDevices not supported.");
          return false;
        }
        try {
          // Query the status of the camera permission
          const permissionStatus = await navigator.permissions.query({
            name: "camera",
          });
          if (permissionStatus.state === "granted") {
            console.log("Camera permission has already been granted.");
            return true;
          } else if (permissionStatus.state === "prompt") {
            console.log("Camera permission is promptable.");
            return false;
          } else {
            console.log("Camera permission has been denied.");
            return false;
          }
        } catch (error) {
          console.log("Error checking camera permission:", error);
          return false;
        }
      }
      function ShowError(error) {
        var errorDiv = document.getElementById("errorDiv");
        errorDiv.style.opacity = 1;
        errorDiv.style.visibility = "visible";
        document.getElementById("errorText").innerHTML = error;
      }
      function ShowScreenshot(dataUrl) {
        var screenshotDiv = document.getElementById("screenshotDiv");
        screenshotDiv.style.opacity = 1;
        screenshotDiv.style.visibility = "visible";
        document.getElementById("screenshotImg").src = dataUrl;
        document.getElementById("screenshotImg").style.width = "80vw";

          (80 / window.innerWidth) * window.innerHeight + "vw";

      function HideScreenshot() {
        var screenshotDiv = document.getElementById("screenshotDiv");
        screenshotDiv.style.opacity = 0;
        setTimeout(() => {
          screenshotDiv.style.visibility = "hidden";
        }, 500);
      }
      function ShowConfirmUrl(url) {
        var confirmUrlDiv = document.getElementById("confirmUrlDiv");
        confirmUrlDiv.style.opacity = 1;
        confirmUrlDiv.style.visibility = "visible";
        window.newUrlString = url;
        document.getElementById("confirmUrlText").innerText =
          "Are you sure you want to visit " + url + "?";
      }
      function HideConfirmUrl() {
        var confirmUrlDiv = document.getElementById("confirmUrlDiv");
        confirmUrlDiv.style.opacity = 0;
        setTimeout(() => {
          confirmUrlDiv.style.visibility = "hidden";
        }, 500);
      }
      window.ITRACKER_GLOBALS = {
        //place global settings here
        INTERNAL_SMOOTHFACTOR_POS: 0.075,
      };
    </script>

    <script>
      // Helper: try to resume the WebGL main loop + refocus canvas
      function resumeUnity() {
        const inst = window.unityInstance;
        const mod = inst && inst.Module;
        const c = document.getElementById("unity-canvas");
        try {
          // Emscripten API exists on Unity WebGL builds
          if (mod && typeof mod.resumeMainLoop === "function") {
            mod.resumeMainLoop(); // ✅ wake rAF loop
            console.log("RAF focused");
          }
        } catch (_) {}

        // Nudge focus
        if (c) {
          c.focus({ preventScroll: true });
          // Dispatch a synthetic click to satisfy engines that still want a gesture hook
          c.dispatchEvent(
            new MouseEvent("click", { bubbles: true, cancelable: true })
          );
        }
      }

      // 1) When the window/tab re-focuses
      window.addEventListener("focus", resumeUnity);

      // 2) When the page becomes visible again
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) resumeUnity();
      });

      // 3) Immediately after the camera prompt resolves (success OR failure)
      (function hookGetUserMedia() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
          return;
        const orig = navigator.mediaDevices.getUserMedia.bind(
          navigator.mediaDevices
        );
        navigator.mediaDevices.getUserMedia = (...args) =>
          orig(...args).finally(() => {
            // Permission sheet just closed → wake Unity
            setTimeout(resumeUnity, 0);
          });
      })();
    </script>

    <script>
      /* ------------------------------------------
   ⏱ BACKGROUND TIME LOGIC
-------------------------------------------*/

      let backgroundStartTime = null;
      const TIMEOUT_LIMIT = 10 * 1000;

      document.addEventListener("visibilitychange", () => {
        /* ----- TAB GOES TO BACKGROUND ----- */
        if (document.hidden) {
          console.log("⛔ Page hidden → stopping camera + starting timer");

          backgroundStartTime = Date.now();

          // Stop camera
          try {
            if (window.webcamStream) {
              window.webcamStream.getTracks().forEach((t) => t.stop());
              window.webcamStream = null;
            }
          } catch (e) {
            console.warn("Error stopping webcam:", e);
          }

          try {
            window.arCamera?.stopWebcam();
          } catch (_) {}

          window._webcamStarted = false;
          return;
        }

        /* ----- TAB RETURNS TO FOREGROUND ----- */
        if (!document.hidden) {
          console.log("🟢 Page visible again");

          // No timer? (first load)
          if (!backgroundStartTime) {
            console.log(
              "Returned with no previous background time → normal continue"
            );
            forceRedraw();
            return;
          }

          const elapsed = Date.now() - backgroundStartTime;
          console.log("⏱ Time away:", elapsed, "ms");

          // Reset the timer
          backgroundStartTime = null;

          /* ➤ 1 minute passed → redirect */
          if (elapsed >= TIMEOUT_LIMIT) {
            console.log("⛔ Over 1 minute away → redirecting");
            window.location.href = "https://www.google.com";
            return;
          }

          /* ➤ Less than 1 minute → resume normally */
          console.log(
            "✅ Under 1 minute → continuing AR and restarting webcam"
          );

          // Restart camera cleanly
          StartWebcam();

          // Fix Unity white-screen issue
          requestAnimationFrame(() => {
            forceRedraw();
          });
        }
      });
    </script>
